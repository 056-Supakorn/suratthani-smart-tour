# Render Blueprint for the FastAPI backend (backend_AI/).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: suratthani-smart-tour-api
    runtime: python
    plan: free
    rootDir: backend_AI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
